[package]
name = "krui-patterns"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KRui — Compile-time type-safe MVVM, MVC, MVI, and Flux/Elm architectural patterns"

[features]
default = []
preview = ["dep:krui-core", "krui-core/preview", "krui-macros/preview"]

[dependencies]
krui-signals = { workspace = true }
krui-ui-types = { workspace = true }
krui-core = { workspace = true, optional = true }
krui-macros = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
