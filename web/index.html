<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRui Showcase (WebAssembly)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #krui-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: default;
        }
    </style>
</head>
<body>
    <canvas id="krui-canvas"></canvas>
    <script type="module">
        import init from "./pkg/krui_showcase_wasm.js";
        const wasm = await init();
        if (typeof wasm.main === "function") {
            wasm.main();
        }
    </script>
</body>
</html>
